<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom Assist</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to Vyom Assist</h1>
    <p>Your smart assistant is ready.</p>
    <button id="startButton">Start Assistant</button>
    <input type="text" id="commandInput" placeholder="Enter your command">

    <button id="sendCommandButton">Send Command</button>
    <button id="voiceButton">🎤 Speak Command</button>

    <div id="shutdownModal" style="display: none;">
        <div>
            <h3>Shutdown Computer?</h3>
            <p>Are you sure you want to shut down the computer?</p>

            <button id="shutdownYesButton">Yes</button>
            <button id="shutdownNoButton">No</button>
        </div>
    </div>

    <div id="restartModal" style="display: none;">
        <div>
            <h3>Restart Computer?</h3>
            <p>Are you sure you want to restart the computer?</p>

            <button id="restartYesButton">Yes</button>
            <button id="restartNoButton">No</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
